<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#0f1630">
  <title>RobPlay</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Fredoka:wght@500;700&family=Silkscreen:wght@400;700&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body class="style-neon">
  <canvas id="game"></canvas>

  <div id="hud" class="hidden">
    <div class="hud-left">
      <span id="hud-level"></span>
      <span id="hud-hearts" class="hearts"></span>
    </div>
    <div class="hud-right">
      <span class="pill"><i data-ic="coin"></i><b id="hud-coins">0/0</b></span>
      <span class="pill"><i data-ic="clock"></i><b id="hud-time">0.0</b></span>
      <span class="pill"><i data-ic="deaths"></i><b id="hud-deaths">0</b></span>
      <span class="pill powers" id="hud-powers-pill"><b id="hud-powers"></b></span>
      <button id="btn-pause" class="icon-btn" aria-label="Pause"><i data-ic="pause"></i></button>
    </div>
  </div>

  <div id="bossbar" class="hidden">
    <span id="boss-name"></span>
    <div class="bar"><div id="boss-fill"></div></div>
  </div>

  <div id="toast" class="hidden"></div>

  <!-- Главное меню -->
  <section id="screen-menu" class="screen">
    <div class="panel menu-panel">
      <h1 class="logo">Rob<span>Play</span></h1>
      <p class="subtitle" data-t="subtitle"></p>
      <div class="menu-badges">
        <span class="pill"><i data-ic="coin"></i><b id="menu-wallet">0</b></span>
        <span class="pill"><i data-ic="star"></i><b id="menu-total">0</b></span>
      </div>
      <button class="btn primary big" data-action="continue"><i data-ic="play"></i><span data-t="play"></span></button>
      <div class="menu-grid">
        <button class="btn" data-action="levels"><i data-ic="map"></i><span data-t="levels"></span></button>
        <button class="btn shop-btn" data-action="shop"><i data-ic="cart"></i><span data-t="shop"></span></button>
        <button class="btn up-btn" data-action="upgrades"><i data-ic="upgrade"></i><span data-t="upgrades"></span></button>
        <button class="btn wheel-btn" data-action="wheel"><i data-ic="wheel"></i><span data-t="wheel"></span></button>
        <button class="btn" data-action="settings"><i data-ic="gear"></i><span data-t="settings"></span></button>
        <button class="btn" data-action="stats"><i data-ic="chart"></i><span data-t="stats"></span></button>
        <button class="btn wide" data-action="howto"><i data-ic="gamepad"></i><span data-t="controls"></span></button>
      </div>
      <div class="row">
        <button class="btn small" data-action="toggle-sound"><i data-ic="sound" class="ic-on"></i><i data-ic="soundOff" class="ic-off"></i><span data-t="sound"></span></button>
        <button class="btn small" data-action="toggle-music"><i data-ic="music"></i><span data-t="music"></span></button>
      </div>
    </div>
  </section>

  <!-- Выбор уровня -->
  <section id="screen-levels" class="screen hidden">
    <div class="panel wide">
      <h2><i data-ic="map"></i><span data-t="selectLevel"></span></h2>
      <div id="world-tabs" class="tabs"></div>
      <div id="level-grid" class="level-grid"></div>
      <button class="btn" data-action="menu"><i data-ic="back"></i><span data-t="back"></span></button>
    </div>
  </section>

  <!-- Магазин -->
  <section id="screen-shop" class="screen hidden">
    <div class="panel wide">
      <h2><i data-ic="cart"></i><span data-t="shopTitle"></span></h2>
      <div class="shop-top">
        <canvas id="shop-preview" width="180" height="150"></canvas>
        <div>
          <div class="wallet"><i data-ic="coin"></i><b id="shop-wallet">0</b></div>
          <p class="hint" data-t="shopHint"></p>
        </div>
      </div>
      <button class="btn wheel-btn" data-action="wheel"><i data-ic="wheel"></i><span data-t="wheelBanner"></span></button>
      <div id="shop-grid" class="shop-grid"></div>
      <button class="btn" data-action="menu"><i data-ic="back"></i><span data-t="back"></span></button>
    </div>
  </section>

  <!-- Улучшения -->
  <section id="screen-upgrades" class="screen hidden">
    <div class="panel wide">
      <h2><i data-ic="upgrade"></i><span data-t="upTitle"></span></h2>
      <div class="wallet small"><i data-ic="coin"></i><b id="up-wallet">0</b></div>
      <h3 data-t="upActive"></h3>
      <div id="up-active" class="up-grid"></div>
      <h3 data-t="upPassive"></h3>
      <div id="up-passive" class="up-grid"></div>
      <button class="btn" data-action="menu"><i data-ic="back"></i><span data-t="back"></span></button>
    </div>
  </section>

  <!-- Колесо фортуны -->
  <section id="screen-wheel" class="screen hidden">
    <div class="panel">
      <h2><i data-ic="wheel"></i><span data-t="wheelTitle"></span></h2>
      <p class="hint"><span data-t="spinsToday"></span>: <b id="wheel-left">3</b> · <span data-t="inBank"></span> <i data-ic="coin"></i><b id="wheel-wallet">0</b></p>
      <canvas id="wheel-canvas" width="320" height="320"></canvas>
      <div id="wheel-result" class="wheel-result"></div>
      <button class="btn primary big" id="btn-spin"></button>
      <button class="btn" data-action="shop"><i data-ic="back"></i><span data-t="toShop"></span></button>
    </div>
  </section>

  <!-- Настройки -->
  <section id="screen-settings" class="screen hidden">
    <div class="panel">
      <h2><i data-ic="gear"></i><span data-t="setTitle"></span></h2>
      <label class="setting"><span><i data-ic="sound"></i><span data-t="sfxVol"></span></span><input type="range" id="set-sfx" min="0" max="100"></label>
      <label class="setting"><span><i data-ic="music"></i><span data-t="musicVol"></span></span><input type="range" id="set-music" min="0" max="100"></label>
      <label class="setting check"><input type="checkbox" id="set-shake"> <span data-t="shake"></span></label>
      <div class="setting"><span><i data-ic="globe"></i><span data-t="language"></span></span><div id="set-lang" class="seg"></div></div>
      <div class="setting"><span><i data-ic="style"></i><span data-t="menuStyle"></span></span><div id="set-style" class="seg wrap"></div></div>
      <button class="btn danger" data-action="reset"><i data-ic="trash"></i><span data-t="reset"></span></button>
      <button class="btn" data-action="menu"><i data-ic="back"></i><span data-t="back"></span></button>
    </div>
  </section>

  <!-- Статистика -->
  <section id="screen-stats" class="screen hidden">
    <div class="panel">
      <h2><i data-ic="chart"></i><span data-t="stTitle"></span></h2>
      <div class="stats" id="stats-list"></div>
      <button class="btn" data-action="menu"><i data-ic="back"></i><span data-t="back"></span></button>
    </div>
  </section>

  <!-- Управление -->
  <section id="screen-howto" class="screen hidden">
    <div class="panel wide">
      <h2><i data-ic="gamepad"></i><span data-t="controls"></span></h2>
      <table class="keys">
        <tr><td><kbd>←</kbd><kbd>→</kbd> / <kbd>A</kbd><kbd>D</kbd></td><td data-t="run"></td></tr>
        <tr><td><kbd>Space</kbd> / <kbd>W</kbd> / <kbd>↑</kbd></td><td data-t="jumpKey"></td></tr>
        <tr><td><kbd>Shift</kbd> / <kbd>X</kbd></td><td data-t="abilityKey"></td></tr>
        <tr><td><kbd>↓</kbd> / <kbd>S</kbd></td><td data-t="dropKey"></td></tr>
        <tr><td><kbd>Esc</kbd> / <kbd>P</kbd></td><td data-t="pauseKey"></td></tr>
        <tr><td><kbd>R</kbd></td><td data-t="restartKey"></td></tr>
      </table>
      <p class="hint" data-t="howHint1"></p>
      <p class="hint" data-t="howHint2"></p>
      <h3 data-t="enemies"></h3>
      <div id="bestiary" class="bestiary"></div>
      <p class="hint"><i data-ic="crown"></i><span data-t="bossesNote"></span></p>
      <button class="btn" data-action="menu"><i data-ic="back"></i><span data-t="back"></span></button>
    </div>
  </section>

  <!-- Пауза -->
  <section id="screen-pause" class="screen hidden">
    <div class="panel">
      <h2 data-t="pause"></h2>
      <button class="btn primary" data-action="resume"><i data-ic="play"></i><span data-t="resume"></span></button>
      <button class="btn" data-action="restart"><i data-ic="refresh"></i><span data-t="restart"></span></button>
      <div class="row">
        <button class="btn small" data-action="toggle-sound"><i data-ic="sound" class="ic-on"></i><i data-ic="soundOff" class="ic-off"></i><span data-t="sound"></span></button>
        <button class="btn small" data-action="toggle-music"><i data-ic="music"></i><span data-t="music"></span></button>
      </div>
      <button class="btn" data-action="levels"><i data-ic="map"></i><span data-t="selectLevel"></span></button>
      <button class="btn" data-action="menu"><i data-ic="back"></i><span data-t="mainMenu"></span></button>
    </div>
  </section>

  <!-- Уровень пройден -->
  <section id="screen-complete" class="screen hidden">
    <div class="panel">
      <h2 id="complete-title"></h2>
      <div class="stars" id="complete-stars"></div>
      <div class="stats" id="complete-stats"></div>
      <button class="btn primary" data-action="next" id="btn-next"><span data-t="next"></span><i data-ic="next"></i></button>
      <button class="btn" data-action="restart"><i data-ic="refresh"></i><span data-t="again"></span></button>
      <button class="btn" data-action="levels"><i data-ic="map"></i><span data-t="selectLevel"></span></button>
    </div>
  </section>

  <!-- Сенсорное управление -->
  <div id="touch" class="hidden">
    <div class="touch-left">
      <button class="tbtn" data-key="left"><i data-ic="left"></i></button>
      <button class="tbtn" data-key="right"><i data-ic="right"></i></button>
    </div>
    <div class="touch-right">
      <button class="tbtn small" data-key="down"><i data-ic="down"></i></button>
      <button class="tbtn" data-key="dash" id="touch-ability"></button>
      <button class="tbtn big" data-key="jump"><i data-ic="jump"></i></button>
    </div>
  </div>

  <script src="levels.js"></script>
  <script src="icons.js"></script>
  <script src="i18n.js"></script>
  <script src="enemies.js"></script>
  <script src="boss.js"></script>
  <script src="fx.js"></script>
  <script src="skins.js"></script>
  <script src="decor.js"></script>
  <script src="menu.js"></script>
  <script src="powerups.js"></script>
  <script src="props.js"></script>
  <script src="wheel.js"></script>
  <script src="abilities.js"></script>
  <script src="game.js"></script>
</body>
</html>
